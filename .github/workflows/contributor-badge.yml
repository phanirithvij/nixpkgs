# Periodically publishes contributor count for Shields.io endpoint badge,
# avoiding GitHub API 403 limits and Camo proxy 504 timeouts on nixpkgs.
name: "Update Contributor Badge"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  update-badge:
    if: github.repository_owner == 'NixOS' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Update badge JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count unique git commit authors and round to metric format (e.g. 13973 -> 14k)
          COUNT=$(git shortlog -s HEAD | wc -l)
          FORMATTED="$(( (COUNT + 500) / 1000 ))k"

          mkdir -p /tmp/badge
          cat <<EOF > /tmp/badge/contributors.json
          {
            "schemaVersion": 1,
            "label": "contributors",
            "message": "$FORMATTED",
            "color": "brightgreen"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          git fetch origin badges:badges 2>/dev/null || git branch badges HEAD
          git checkout badges

          cp /tmp/badge/contributors.json ./contributors.json
          git add contributors.json

          if ! git diff --staged --quiet; then
            git commit -m "contributors.json: update to $FORMATTED"
            git push origin badges
          fi
